name: Build Windows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 Standalone and tests
        run: cmake --build build --config Release --target PreChorus_VST3 PreChorus_Standalone PreChorusTests --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
