name: Build

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (VST3 + CLAP + Standalone)
            os: ubuntu-latest
          - name: Windows (VST3 + CLAP + Standalone)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: PreChorus-${{ runner.os }}
          path: |
            build/PreChorus_artefacts/Release/VST3/**
            build/PreChorus_artefacts/Release/CLAP/**
            build/PreChorus_artefacts/Release/Standalone/**
          if-no-files-found: error
